<div class="profile-card">
  <h2>{{ site.data.author.name }}</h2>
  <p class="text-muted mb-3">{{ site.data.author.affiliation }}</p>
  <p>{{ site.data.author.bio }}</p>
  {% if site.data.author.email %}
    <p><strong>Email:</strong> <a href="mailto:{{ site.data.author.email }}">{{ site.data.author.email }}</a></p>
  {% endif %}
</div>
