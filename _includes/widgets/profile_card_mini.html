<div class="profile-card text-center">
  {% if site.data.author.profile_photo %}
    <img src="{{ site.data.author.profile_photo | relative_url }}" alt="Profile" class="profile-img">
  {% else %}
    <div class="profile-img" style="background: #e9ecef; display: flex; align-items: center; justify-content: center;">
      <i class="fas fa-user" style="font-size: 60px; color: #999;"></i>
    </div>
  {% endif %}
  <h5>{{ site.data.author.name }}</h5>
  <p class="text-muted" style="font-size: 0.9em;">{{ site.data.author.affiliation }}</p>
  <div class="mt-3">
    {% for social in site.data.author.social %}
      <a href="{{ social.url }}" class="btn btn-sm btn-outline-secondary" style="margin: 5px;">
        <i class="{{ social.icon }}"></i>
      </a>
    {% endfor %}
  </div>
</div>
